name: python-checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install package and build tools
        run: |
          python -m pip install --disable-pip-version-check '.[web]' build
      - name: Fixtures and package build
        run: |
          python -m unittest discover -s tests -v
          python -m build
